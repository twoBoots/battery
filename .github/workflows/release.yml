name: Release Binary

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  auto-tag:
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check and push Git tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep -E '^\s*Version\s*=' cmd/root.go | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -z "$VERSION" ]; then
            echo "Could not detect Version in cmd/root.go, falling back to 1.0.0"
            VERSION="1.0.0"
          fi
          TAG="v${VERSION}"
          echo "Checking if tag ${TAG} exists on origin..."
          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q "${TAG}"; then
            echo "Tag ${TAG} already exists on origin. Proceeding..."
          else
            echo "Tag ${TAG} does not exist on origin. Creating and pushing tag ${TAG}..."
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "${TAG}" -m "Release ${TAG}"
            git push origin "${TAG}"
          fi

  build-and-release:
    needs: [ci, auto-tag]
    if: always() && needs.ci.result == 'success' && (needs.auto-tag.result == 'success' || needs.auto-tag.result == 'skipped')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            binary: battery-linux-x86_64
          - goos: linux
            goarch: arm64
            binary: battery-linux-aarch64
          - goos: darwin
            goarch: amd64
            binary: battery-darwin-x86_64
          - goos: darwin
            goarch: arm64
            binary: battery-darwin-aarch64
          - goos: windows
            goarch: amd64
            binary: battery-windows-x86_64.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.27"
          cache: true

      - name: Compile Go Binary (${{ matrix.goos }}/${{ matrix.goarch }})
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          VERSION=$(grep -E '^\s*Version\s*=' cmd/root.go | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -z "$VERSION" ]; then
            VERSION="1.0.0"
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "Building Battery version: ${VERSION}"
          go build -ldflags="-s -w -X github.com/twoboots/battery/cmd.Version=${VERSION}" -o dist/${{ matrix.binary }} .

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.binary }}
          path: dist/${{ matrix.binary }}

  publish-release:
    needs: build-and-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Create or Update GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep -E '^\s*Version\s*=' cmd/root.go | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -z "$VERSION" ]; then
            VERSION="1.0.0"
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          TAG="v${VERSION}"
          
          echo "Publishing release assets for semantic tag: $TAG"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release for $TAG exists. Updating release assets..."
            gh release upload "$TAG" release-assets/* --clobber
          else
            echo "Release for $TAG does not exist. Creating release with assets..."
            gh release create "$TAG" release-assets/* --title "Battery $TAG" --notes "Automated Go binary release for Battery $TAG"
          fi
          
          echo "Publishing release assets for tag: latest"
          if gh release view "latest" >/dev/null 2>&1; then
            echo "Release for latest exists. Updating release assets..."
            gh release upload "latest" release-assets/* --clobber
          else
            echo "Release for latest does not exist. Creating release with assets..."
            gh release create "latest" release-assets/* --title "Battery latest" --notes "Latest automated Go binary release for Battery"
          fi
